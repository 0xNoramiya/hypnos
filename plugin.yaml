name: hypnos
label: Hypnos
kind: standalone
version: "0.1.0"
manifest_version: 2
author: kudaliar
license: MIT
homepage: https://github.com/0xNoramiya/hypnos
description: >-
  Hermes learns in its sleep. Hypnos watches what you approve, deny and
  correct, then at night replays the day, practises its mistakes in a sandbox
  and consolidates your habits into a small personal LoRA brain. Turns the
  brain has mastered are routed to it, with the learned habits pruned from its
  prompt. Facts stay in Hermes memory; only habits go into the weights.
requires_hermes: ">=0.23.0"
# Training runs in a separate interpreter that Hypnos never installs into Hermes.
python_runtime: external
tags: [learning, local-models, fine-tuning, lora, memory, routing, privacy]
provides_tools: []
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - post_approval_response
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - post_compaction
  - on_session_delete
  - transform_llm_output
provides_middleware:
  - llm_execution
config_schema:
  enabled:
    type: bool
    default: true
    label: Hypnos on
    description: Capture what you approve, deny and correct, and route mastered turns to your brain.
  exclude_platforms:
    type: list
    default: [cron]
    label: Never learn from these platforms
    description: Turns on these platforms are not captured. Cron runs have no human to learn from.
  capture_subagents:
    type: bool
    default: false
    label: Learn from subagent turns
  inject_habits:
    type: bool
    default: true
    label: Remind Hermes of learned habits
    description: Append the learned habits to each turn's message for your normal model. Not saved to the transcript.
  pressure_scale:
    type: float
    default: 25.0
    label: Sleep pressure scale
    description: Weighted signal total that reads as 63% pressure. Lower means you get sleepy sooner.
  retention_days:
    type: int
    default: 90
    label: Keep captured turns for (days)
  base_model:
    type: str
    default: Qwen/Qwen3-0.6B
    label: Brain base model
    description: Small open tool-calling model the LoRA brain is trained on. Qwen/Qwen3-1.7B is a good choice on a GPU.
  tiny_model:
    type: str
    default: HuggingFaceTB/SmolLM2-135M-Instruct
    label: Tiny model for quick test nights (--tiny)
  trainer_python:
    type: str
    default: ""
    label: Trainer Python
    description: Interpreter with torch, transformers and peft. Empty means plugin-data/hypnos/trainer/bin/python.
  cycles:
    type: int
    default: 4
    label: Sleep cycles per night
  night_max_minutes:
    type: int
    default: 60
    label: Longest night (minutes)
  probe_pass_threshold:
    type: float
    default: 0.9
    label: Consolidation threshold
    description: Share of a habit's probes the brain must pass without the habit text before it is pruned from the prompt.
  brain_port:
    type: int
    default: 8765
    label: Brain server port (loopback only)
  routing:
    type: str
    choices: [auto, shadow_only, off]
    default: auto
    label: Brain routing
    description: auto lets a family go live after it agrees with your model in shadow mode; shadow_only never lets the brain answer; off disables routing.
  shadow_agree_turns:
    type: int
    default: 5
    label: Agreeing shadow turns before a family goes live
  confidence_threshold:
    type: float
    default: -0.35
    label: Brain confidence threshold
    description: Minimum mean token log-probability of a brain answer. Below it, your normal model answers instead.
  brain_timeout_s:
    type: int
    default: 20
    label: Brain timeout (seconds)
  brain_max_context:
    type: int
    default: 3072
    label: Largest brain prompt (tokens)
  brain_endpoint:
    type: str
    default: ""
    label: Brain endpoint
    description: Your own OpenAI-compatible server for the brain (for example http://127.0.0.1:8081/v1). Empty means Hypnos runs its own on loopback.
  auto_start_brain_server:
    type: bool
    default: true
    label: Start the brain server after a promoted night
  teacher:
    type: str
    choices: [auto, llm, scripted]
    default: auto
    label: Dream teacher
    description: llm writes dream variants with your model through Hermes (budget-capped); scripted uses built-in templates and never calls a model; auto tries llm and falls back.
  dream_variants:
    type: int
    default: 4
    label: Dream variants per habit
  teacher_budget_tokens:
    type: int
    default: 60000
    label: Teacher token budget per night
  teacher_usd_per_mtok:
    type: float
    default: 3.0
    label: Your model's price per million tokens (USD)
    description: Used to turn the dollar cap below into tokens. Set it to your model's blended price.
  night_max_usd:
    type: float
    default: 0.5
    label: Most a night may spend on the teacher (USD)
  sandbox:
    type: bool
    default: true
    label: Run dreams in the Docker sandbox
    description: No network, no host mounts, tmpfs only. Without Docker, dreams run in lucid mode (pattern checks only).
  desktop_reply_badges:
    type: bool
    default: true
    label: Badge replies in Hermes Desktop
    description: Adds a short marker to Desktop replies so each one shows "brain vN" or "frontier". The marker stays in the transcript (about 20 tokens).
